name: Release

# Push a tag like v0.1.0 to build the installer and attach it to a GitHub Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version from tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=0.0.0-dev" >> "$GITHUB_ENV"; fi

      - name: Build
        run: |
          cmake -S plugin -B plugin/build -G "Visual Studio 17 2022" -A x64
          cmake --build plugin/build --config Release --target MobiMic_VST3 MobiMic_Standalone MobiMicHeadlessTest MobiMicHostRecordTest -- -m -v:m -nologo

      - name: Test
        run: |
          python -m pip install numpy websockets
          python plugin/tests/run_tests.py
          python plugin/tests/test_ableton_helper.py
          python plugin/tests/test_host_record.py
          python plugin/tests/test_phone_page.py

      - name: Installer
        shell: cmd
        run: '"%ProgramFiles(x86)%\Inno Setup 6\ISCC.exe" /Qp /DAppVersion=%VERSION% installer\setup.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: MobiMic-Setup
          path: installer/Output/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
